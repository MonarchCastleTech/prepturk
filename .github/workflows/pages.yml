name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "tests/site/**"
      - "scripts/check_pages_site.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "site/**"
      - "tests/site/**"
      - "scripts/check_pages_site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run deterministic site tests
        run: node --test tests/site/*.test.mjs
      - name: Validate static and offline contract
        run: node scripts/check_pages_site.mjs site
      - name: Smoke test local Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site >/tmp/prepturk-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            http://127.0.0.1:4173/ -o /tmp/prepturk-index.html
          grep --fixed-strings "PrepTürk | Çevrimdışı Acil Hazırlık Alanı" /tmp/prepturk-index.html
          grep --fixed-strings "Hane hazırlık kaydı" /tmp/prepturk-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/app.mjs -o /tmp/prepturk-app.mjs
          curl --fail --silent --show-error http://127.0.0.1:4173/sw.js -o /tmp/prepturk-sw.js
          grep --fixed-strings "STORAGE_KEY" /tmp/prepturk-app.mjs
          grep --fixed-strings "CACHE_NAME" /tmp/prepturk-sw.js

  deploy:
    name: Deploy immutable artifact
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment

  verify:
    name: Post-deploy HTTP verification
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Wait for deployed content and verify assets
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"
          index_url="${base_url}?version=${DEPLOY_SHA}"
          ready=false
          for attempt in {1..18}; do
            status="$(curl --location --silent --show-error --output /tmp/prepturk-live.html --write-out '%{http_code}' "$index_url" || true)"
            if [[ "$status" == "200" ]] && grep --quiet --fixed-strings "PrepTürk | Çevrimdışı Acil Hazırlık Alanı" /tmp/prepturk-live.html && grep --quiet --fixed-strings "Hane hazırlık kaydı" /tmp/prepturk-live.html; then
              ready=true
              break
            fi
            sleep 10
          done
          [[ "$ready" == "true" ]] || { echo "Deployment did not expose expected HTML"; exit 1; }
          curl --fail --location --silent --show-error "${base_url}assets/app.mjs?version=${DEPLOY_SHA}" -o /tmp/prepturk-live-app.mjs
          curl --fail --location --silent --show-error "${base_url}assets/data.mjs?version=${DEPLOY_SHA}" -o /tmp/prepturk-live-data.mjs
          curl --fail --location --silent --show-error "${base_url}sw.js?version=${DEPLOY_SHA}" -o /tmp/prepturk-live-sw.js
          grep --quiet --fixed-strings "STORAGE_KEY" /tmp/prepturk-live-app.mjs
          grep --quiet --fixed-strings "PROVINCES" /tmp/prepturk-live-data.mjs
          grep --quiet --fixed-strings "CACHE_NAME" /tmp/prepturk-live-sw.js
          echo "Verified ${base_url} at ${DEPLOY_SHA}"
